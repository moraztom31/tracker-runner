name: publish-once
on: workflow_dispatch
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publication sur gh-pages
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          pip install -q cryptography
          mkdir site
          cp -r app/docs/. site/
          rm -f site/jobs.json
          python app/runner/encrypt_site.py app/docs/jobs.json site/jobs.enc
          cd site
          git init -q -b gh-pages
          git config user.name "stage-tracker"
          git config user.email "bot@users.noreply.github.com"
          git add -A
          git commit -q -m "maj offres"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
