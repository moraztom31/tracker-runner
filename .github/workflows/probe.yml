name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests curl_cffi
      - name: dr
        run: |
          python - <<'EOF'
          import re, json
          from curl_cffi import requests as cr
          A='https://api.digitalrecruiters.com/careers/v1'
          H={'Accept':'application/json','Origin':'https://careers.la-francaise.com','Referer':'https://careers.la-francaise.com/'}
          D='careers.la-francaise.com'
          tests=[
           f'{A}/careers-site/job-ads',
           f'{A}/careers-site/job-ads?domain_name={D}',
           f'{A}/careers-site/job-ads?domain={D}&locale=fr',
           f'{A}/careers-site/job-ads?careers_site_domain={D}&page=1&per_page=50',
           f'{A}/careers-sites/{D}/job-ads',
           f'{A}/careers-site/job-ads?host={D}',
          ]
          for u in tests:
              try:
                  r=cr.get(u,impersonate='chrome124',timeout=20,headers=H)
                  print(r.status_code,u.replace(A,'')[:90],'|',r.text[:260].replace('\n',' '))
              except Exception as e: print('ERR',u[-60:],str(e)[:60])
          EOF
