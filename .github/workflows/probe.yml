name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests curl_cffi
      - name: dr
        run: |
          python - <<'EOF'
          import json
          from curl_cffi import requests as cr
          H={'Accept':'application/json','Content-Type':'application/json','Origin':'https://careers.la-francaise.com','Referer':'https://careers.la-francaise.com/'}
          D='careers.la-francaise.com'
          U='https://api.digitalrecruiters.com/public/v1/careers-site/job-ads'
          tests=[
            (U,{}),
            (U+'?domain_name='+D,{}),
            (U+'?locale=fr&page=1&limit=50',{'domain_name':D}),
            (U,{'domain_name':D,'locale':'fr','page':1,'limit':50}),
            (U,{'careers_site_domain':D}),
            (U,{'domain':D}),
            (U,{'host':D}),
            (U+'?locale=fr',{'filters':{},'domain_name':D}),
          ]
          for u,body in tests:
              try:
                  r=cr.post(u,json=body,impersonate='chrome124',timeout=25,headers=H)
                  print(r.status_code,u.replace(U,'')[:50],json.dumps(body)[:70],'|',r.text[:380].replace('\n',' '))
              except Exception as e: print('ERR',str(e)[:70])
          EOF
