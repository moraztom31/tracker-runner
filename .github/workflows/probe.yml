name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: workday
        run: |
          python - <<'EOF'
          import re, requests
          from urllib.parse import urlparse
          from concurrent.futures import ThreadPoolExecutor
          NAMES = """Carmignac|Candriam|DNCA|Amiral Gestion|Comgest|Dorval|Sycomore|Moneta|TOBAM|Varenne|La Francaise|Lazard|Natixis|Ofi|Pictet|Quintet|Vontobel|Leonteq|Euronext|Euroclear|Eurazeo|Tikehau|Siparex|Bpifrance|Allianz|Allianz Global Investors|AllianzGI|Generali|Swiss Life|Janus Henderson|JanusHenderson|Franklin Templeton|FranklinTempleton|Exane|Mandarine|Ecofi|H2O|CIC|Neuflize|Nasdaq|Morningstar|Mediobanca|Marex|Fundsmith|M&G|MandG|DNB|Storebrand|Principal|Utmost|Baloise|MetLife|CNP|Covea|Malakoff Humanis|AG2R|Abeille|Arkea|Groupama|Altaroc|Archimed|Ares|Bitwise|Sofidy|Corum|Perial|Paref|Praemia|Advenis|AEW|Eiffel|Montpensier|Ostrum|Mirova|Meeschaert|Indosuez|Aviva|Edmond de Rothschild|Amundi|Credit Mutuel|Crédit Agricole|CACEIS|Societe Generale|SG|Ardian|BNP Paribas|Cardif|Covéa|Scor|Axa|AXA IM|AXA Investment Managers|Natixis IM|Candriam Investors""".split('|')
          def tenants(n):
              b=re.sub(r"[^a-z0-9 ]","",n.lower().replace('&',' and ').replace('é','e').replace('è','e').replace('crédit','credit'))
              w=b.split()
              return {x for x in {''.join(w), w[0], ''.join(w[:2])} if len(x)>2}
          PODS=[1,3,5,12,103]
          def step1(t):
              ten,n=t
              try:
                  r=requests.get(f'https://{ten}.wd{n}.myworkdayjobs.com/',timeout=6,allow_redirects=True,headers={'User-Agent':'Mozilla/5.0'})
                  host=urlparse(r.url).hostname or ''
                  if r.status_code==200 and host.startswith(ten+'.') and host.endswith('myworkdayjobs.com'): return (ten,n,r.url)
              except Exception: pass
          cands={(t,n) for nm in NAMES for t in tenants(nm) for n in PODS}
          print(len(cands),'tenants à tester')
          found=[]
          with ThreadPoolExecutor(32) as ex:
              for h in ex.map(step1,sorted(cands)):
                  if h: found.append(h); print('TENANT',h)
          SITES=['External','Careers','careers','external','ExternalCareers','ExternalCareerSite','Jobs','jobs','Global','External_Careers','careers_external']
          def step2(t):
              ten,n,url=t
              sites=SITES+[ten,ten.capitalize(),ten.upper()]
              # le site apparait souvent dans l'URL finale
              m=re.search(r'myworkdayjobs\.com/(?:[a-z]{2}-[A-Z]{2}/)?([^/?#]+)',url)
              if m: sites=[m.group(1)]+sites
              for s in dict.fromkeys(sites):
                  try:
                      r=requests.post(f'https://{ten}.wd{n}.myworkdayjobs.com/wday/cxs/{ten}/{s}/jobs',json={'appliedFacets':{},'limit':3,'offset':0,'searchText':'stage'},timeout=8)
                      if r.status_code==200 and 'total' in r.json():
                          j=r.json(); return (ten,n,s,j['total'],[x.get('title') for x in j.get('jobPostings',[])][:2])
                  except Exception: pass
          print('--- sites')
          with ThreadPoolExecutor(16) as ex:
              for h in ex.map(step2,found):
                  if h: print('SITE',h)
          EOF
