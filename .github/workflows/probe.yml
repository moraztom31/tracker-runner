name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: claude/github-repository-access-aoguba
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt
      - name: tests
        working-directory: app
        run: |
          python - <<'EOF'
          import yaml, re, json
          from tracker.sources import COLLECTORS, _get
          from tracker.filters import matches
          cfg=yaml.safe_load(open('config.yaml',encoding='utf-8'))
          for kind,lst in cfg['sources'].items():
              for c in (lst or []):
                  if c['company'] not in {'Candriam','CIC','DNCA','Ofi Invest'}: continue
                  try: jobs=COLLECTORS[kind](c)
                  except Exception as e: print('[KO]',c['company'],type(e).__name__,str(e)[:100]); continue
                  kept=[j for j in jobs if matches(j,cfg['filters'])]
                  print(f"[OK] {c['company']:<12} {len(jobs):>4} lues, {len(kept):>3} gardées, {len({j['url'] for j in jobs})} urls distinctes")
                  for j in (kept or jobs)[:3]: print('      ',j['title'][:70],'|',j.get('location','')[:45],'|',j['url'][-60:])
          print('===== DigitalRecruiters (La Française)')
          from curl_cffi import requests as cr
          D='https://api.digitalrecruiters.com/careers/v1/careers-sites/careers.la-francaise.com'
          for path in ['/jobs','/job-ads','/ads','/offers','/jobs?limit=50','/search?limit=50','']:
              try:
                  r=cr.get(D+path,impersonate='chrome124',timeout=20,headers={'Accept':'application/json'})
                  print('  ',path or '(racine)',r.status_code,len(r.text),r.text[:160].replace('\n',' '))
              except Exception as e: print('  ',path,'ERR',str(e)[:60])
          print('===== Pictet : indices dans la page')
          r=cr.get('https://career012.successfactors.eu/career?company=banquepict&career_ns=job_listing_summary&navBarLevel=JOB_SEARCH',impersonate='chrome124',timeout=30)
          t=r.text
          for pat in [r'ajax[^"\' ]{0,80}',r'remoting[^"\' ]{0,60}',r'jobSearch[^"\' ]{0,50}',r'rcm[^"\' ]{0,50}',r'career_ns=[a-z_]+',r'/career\?[^"\' ]{0,100}']:
              print('  ',pat[:14],sorted(set(re.findall(pat,t)))[:8])
          EOF
