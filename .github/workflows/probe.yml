name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt
      - name: bwelcome
        working-directory: app
        run: |
          python - <<'EOF'
          import re
          from tracker.sources import _get
          B='https://bwelcome.hr.bnpparibas'
          def locs(u):
              t=_get(u,'chrome124').text
              print('==',u,len(t),t[:200].replace('\n',' '))
              return re.findall(r'<loc>\s*([^<]+?)\s*</loc>',t), t
          L,_=locs(B+'/externalcareers/sitemap_index.xml')
          print('index:',len(L),L[:10])
          allj=[]
          for u in L[:20]:
              try:
                  l,t=locs(u)
                  print('  sous-plan',len(l),l[:3])
                  allj+=l
              except Exception as e: print('  ERR',u,str(e)[:80])
          jd=[l for l in allj if 'JobDetail' in l or 'jobId' in l]
          print('offres dans les plans:',len(jd)); print(jd[:5])
          print('104697:',[l for l in allj if '104697' in l][:3])
          EOF
