name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: claude/github-repository-access-aoguba
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt
      - name: test
        working-directory: app
        run: |
          python - <<'EOF'
          import yaml
          from tracker.sources import COLLECTORS
          from tracker.filters import matches
          cfg=yaml.safe_load(open('config.yaml',encoding='utf-8'))
          NEW={'Marshall Wace','Monzo','N26','Adyen','Bitpanda','Roland Berger','Coface','Wise','Voleon','Qonto','Younited','Memo Bank','Payplug','BC Partners'}
          tot=0
          for kind,lst in cfg['sources'].items():
              for c in (lst or []):
                  if c['company'] not in NEW: continue
                  try: jobs=COLLECTORS[kind](c)
                  except Exception as e: print(f"[KO] {c['company']} {kind} : {type(e).__name__} {str(e)[:90]}"); continue
                  kept=[j for j in jobs if matches(j,cfg['filters'])]; tot+=len(kept)
                  print(f"[OK] {c['company']:<14} {kind:<16} {len(jobs):>4} lues, {len(kept):>3} gardées")
                  for j in (kept or jobs)[:2]: print('      ',j['title'][:60],'|',j.get('location','')[:30],'|',j['url'][-45:])
          print('TOTAL gardées',tot)
          EOF
