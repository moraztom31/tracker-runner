name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt
      - name: bwelcome
        working-directory: app
        run: |
          python - <<'EOF'
          import re
          from tracker.sources import _get
          B='https://bwelcome.hr.bnpparibas'
          print(_get(B+'/robots.txt','chrome124').text[:1500])
          t=_get(B+'/sitemap.xml','chrome124').text
          print('--- sitemap debut'); print(t[:700])
          locs=re.findall(r'<loc>\s*([^<]+?)\s*</loc>',t)
          print('loc',len(locs))
          jd=[l for l in locs if 'JobDetail' in l]
          print('JobDetail',len(jd)); print(jd[:5])
          print('contient 104697:',[l for l in locs if '104697' in l][:3])
          print('sous-plans:',[l for l in locs if l.endswith('.xml')][:10])
          from collections import Counter
          print(Counter(re.sub(r'/[^/]*$','',l.split('bnpparibas',1)[-1])[:50] for l in locs).most_common(8))
          EOF
