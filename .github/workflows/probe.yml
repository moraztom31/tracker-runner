name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests
      - name: ats
        run: |
          python - <<'PY'
          import re, requests
          from concurrent.futures import ThreadPoolExecutor
          names = """interactive brokers|ig|ig markets|saxo bank|saxo|cmc markets|cmc|plus500|etoro|degiro|boursorama|boursobank|binck|fortuneo|trade republic|freetrade|xtb|oanda|pepperstone|capital com|exness|ic markets|forex com|gain capital|city index|tickmill|fxcm|swissquote|dukascopy|admiral markets|admirals|avatrade|vantage|axi|eightcap|blackbull|fxpro|xm|hotforex|ebury|currencies direct|moneycorp|travelex|western union|worldremit|remitly|payoneer|ayvens|marex|stonex|intl fcstone|bgc|cantor|cantor fitzgerald|tp icap|icap|tullett prebon|tradition|gfi|clear street|apex clearing|pershing|bny pershing|abn amro clearing|optiver|schwab|charles schwab|fidelity|td ameritrade|e trade|webull|tastytrade|tradestation|public com|moomoo|futu|tiger brokers|ally invest|merrill edge|vanguard|stash|acorns|m1 finance|sofi|wealthsimple|questrade|nutmeg|moneyfarms|scalable capital|bux|lightyear|invest engine|hargreaves lansdown|interactive investor|ajbell|aj bell|bestinvest|charles stanley|barclays smart investor|cavendish|bnp paribas wealth|marsh|marsh mclennan|aon|willis towers watson|wtw|gallagher|arthur j gallagher|howden|brown brown|lockton|bgl|jlt|hiscox|beazley|lloyds|tokio marine|sompo|everest|arch capital|renaissancere|ardonagh|clear group|ethos|bowring|miller|price forbes|tysers|besso|jencap|acrisure|hub international|alliant|usi|ryan specialty|bishop street""".split("|")
          names = sorted(set(n.strip() for n in names if n.strip()))
          def slugs(n):
              a = re.sub(r'[^a-z0-9]','',n.lower()); b = re.sub(r'[^a-z0-9]+','-',n.lower()).strip('-')
              return sorted({a,b,a+'group'})
          def get(u):
              try:
                  return requests.get(u, timeout=10, headers={'User-Agent':'Mozilla/5.0'})
              except Exception: return None
          def check(n):
              out=[]
              for s in slugs(n):
                  r=get(f'https://boards-api.greenhouse.io/v1/boards/{s}/jobs')
                  if r is not None and r.status_code==200:
                      try: out.append(('greenhouse',s,len(r.json().get('jobs',[]))))
                      except Exception: pass
                  r=get(f'https://api.lever.co/v0/postings/{s}?mode=json')
                  if r is not None and r.status_code==200:
                      try: out.append(('lever',s,len(r.json())))
                      except Exception: pass
                  r=get(f'https://api.smartrecruiters.com/v1/companies/{s}/postings?limit=1')
                  if r is not None and r.status_code==200:
                      try:
                          t=r.json().get('totalFound',0)
                          if t: out.append(('smartrecruiters',s,t))
                      except Exception: pass
                  r=get(f'https://api.ashbyhq.com/posting-api/job-board/{s}')
                  if r is not None and r.status_code==200:
                      try: out.append(('ashby',s,len(r.json().get('jobs',[]))))
                      except Exception: pass
                  r=get(f'https://{s}.recruitee.com/api/offers')
                  if r is not None and r.status_code==200:
                      try: out.append(('recruitee',s,len(r.json().get('offers',[]))))
                      except Exception: pass
                  r=get(f'https://{s}.teamtailor.com/jobs.rss')
                  if r is not None and r.status_code==200 and '<item>' in r.text:
                      out.append(('teamtailor',s,r.text.count('<item>')))
                  r=get(f'https://apply.workable.com/api/v1/widget/accounts/{s}')
                  if r is not None and r.status_code==200:
                      try: out.append(('workable',s,len(r.json().get('jobs',[]))))
                      except Exception: pass
              return n,out
          with ThreadPoolExecutor(24) as p:
              for n,o in p.map(check,names):
                  if o: print(n,o)
          PY
