name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt
      - name: bwelcome
        working-directory: app
        run: |
          python - <<'EOF'
          import re, time
          from bs4 import BeautifulSoup
          from tracker.sources import _get
          B='https://bwelcome.hr.bnpparibas/fr_FR/externalcareers/'
          for p in ['WidgetOpenPositions','WidgetOpenPositions?jobFamily=','WidgetRelatedJobs?jobId=104697','WidgetRecommendations']:
              try:
                  r=_get(B+p,'chrome124')
                  s=BeautifulSoup(r.text,'html.parser')
                  ids=sorted(set(re.findall(r'jobId=(\d+)',r.text)))
                  print('==',p,r.status_code,len(r.text),'jobIds',len(ids),ids[:10])
                  print('   texte:',s.get_text(' ',strip=True)[:300])
                  print('   liens:',[a['href'][:100] for a in s.find_all('a',href=True)][:8])
              except Exception as e: print('==',p,'ERR',str(e)[:80])
          print('--- séquentiel lent')
          for i in range(104694,104700):
              try:
                  r=_get(B+f'JobDetails?jobId={i}','chrome124'); print(i,'OK',len(r.text))
              except Exception as e: print(i,str(e)[:40])
              time.sleep(1.5)
          EOF
