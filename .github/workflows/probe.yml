name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          ref: claude/github-repository-access-aoguba
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt
      - name: test
        working-directory: app
        run: |
          python - <<'PY'
          import yaml
          from tracker.sources import COLLECTORS
          from tracker.main import matches
          cfg = yaml.safe_load(open("config.yaml"))
          for c in cfg["sources"]["oracle_hcm"]:
              if "BGC" not in c["company"]: continue
              jobs = COLLECTORS["oracle_hcm"](c)
              kept = [j for j in jobs if matches(j, cfg["filters"])]
              print(c["company"], len(jobs), "lues", len(kept), "gardées")
              for j in jobs[:8]: print("  tout:", j["title"][:70], "|", j.get("location", "")[:30])
              for j in kept[:10]: print("  gardée:", j["title"][:70], "|", j.get("location", "")[:30], j["url"][:90])
          PY
