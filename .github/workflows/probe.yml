name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: claude/github-repository-access-aoguba
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt
      - name: test final
        working-directory: app
        run: |
          python - <<'EOF'
          import yaml
          from tracker.sources import COLLECTORS, _get
          from tracker.filters import matches
          cfg=yaml.safe_load(open('config.yaml',encoding='utf-8'))
          NEW={'Candriam','Ofi Invest','Quintet','CIC','Comgest','DNCA','Generali','Janus Henderson','Lazard','Euroclear','Euronext','Allianz','Franklin Templeton','La Française','Sycomore AM','Swissquote','Altarea','Tikehau Capital','Capza','Finary'}
          tot=0
          for kind,lst in cfg['sources'].items():
              for c in (lst or []):
                  if c['company'] not in NEW: continue
                  try: jobs=COLLECTORS[kind](c)
                  except Exception as e: print(f"[KO] {c['company']} {kind} : {type(e).__name__} {str(e)[:90]}"); continue
                  kept=[j for j in jobs if matches(j,cfg['filters'])]; tot+=len(kept)
                  print(f"[OK] {c['company']:<18} {kind:<17} {len(jobs):>4} lues, {len(kept):>3} gardées")
                  for j in (kept or jobs)[:2]: print('      ',j['title'][:62],'|',j.get('location','')[:34],'|',j['url'][-50:])
                  if c['company']=='La Française' and jobs:
                      try: r=_get(jobs[0]['url'],'chrome124'); print('      page offre :',r.status_code)
                      except Exception as e: print('      page offre KO',str(e)[:60])
          print('TOTAL gardées',tot)
          EOF
