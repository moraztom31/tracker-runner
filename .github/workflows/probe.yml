name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4 curl_cffi
      - name: pages
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cr
          urls = ["https://aurelbgc.com","https://www.aurel-bgc.com","https://aurel-bgc.com","https://www.aurelbgc.fr","https://aurelbgc.fr","https://www.aurelbgc.eu","https://bgcpartners.com/careers","https://www.bgcpartners.com/careers","https://www.bgcg.com","https://bgcg.com/careers","https://jobs.bgcg.com","https://bgc.wd1.myworkdayjobs.com","https://www.aurel-bgc.fr","https://www.aurel-bgc.com/carrieres"]
          for u in urls:
              try:
                  r = cr.get(u, impersonate="chrome124", timeout=25, allow_redirects=True)
              except Exception as e:
                  print("ERR", u, type(e).__name__); continue
              t = r.text
              soup = BeautifulSoup(t, "html.parser")
              print("==", u, "->", r.url, r.status_code, len(t), "|", (soup.title.get_text(strip=True)[:70] if soup.title else ""))
              hints = sorted(set(re.findall(r"(myworkdayjobs|phenom|smartrecruiters|greenhouse|lever\.co|taleo|successfactors|icims|oraclecloud|avature|jobvite|teamtailor|workable|recruitee|ashby|digitalrecruiters|talentsoft|eightfold|jibe|brassring|welcometothejungle|jobteaser)", t, re.I)))
              print("   plateformes:", hints[:8])
              links = [(a.get_text(" ", strip=True)[:50], a["href"][:110]) for a in soup.find_all("a", href=True) if re.search(r"job|offre|career|carri|stage|intern|recrut|apply|rejoin", a["href"] + a.get_text(), re.I)]
              for l in links[:10]: print("   ", l)
          PY
