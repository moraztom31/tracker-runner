name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests curl_cffi
      - name: dr
        run: |
          python - <<'EOF'
          import json
          from curl_cffi import requests as cr
          H={'Accept':'application/json','Content-Type':'application/json','Origin':'https://careers.la-francaise.com','Referer':'https://careers.la-francaise.com/'}
          D='careers.la-francaise.com'
          U='https://api.digitalrecruiters.com/public/v1/careers-site/job-ads'
          tests=[
            (U,{'domainName':D}),
            (U+'?domainName='+D,{}),
            (U,{'domainName':D,'locale':'fr'}),
            (U,{'domainName':D,'page':1,'perPage':50}),
            (U,{'domainName':'la-francaise.com'}),
            (U,{'domainName':D,'filters':{}}),
            (U+'?domainName='+D+'&locale=fr&page=1&limit=50',{'domainName':D}),
          ]
          for u,body in tests:
              try:
                  r=cr.post(u,json=body,impersonate='chrome124',timeout=25,headers=H)
                  print(r.status_code,u.replace(U,'')[:60],json.dumps(body)[:70],'|',r.text[:450].replace('\n',' '))
              except Exception as e: print('ERR',str(e)[:70])
          EOF
