name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt
      - name: BNP
        working-directory: app
        run: |
          python - <<'EOF'
          import re
          from bs4 import BeautifulSoup
          from tracker.sources import _get
          H='https://group.bnpparibas'
          for sm in ['/sitemap.xml','/sitemap_index.xml']:
              try:
                  t=_get(H+sm,'chrome124').text
                  print(sm,len(t),'octets')
                  subs=re.findall(r'<loc>([^<]+)</loc>',t)
                  print('  entrees',len(subs),subs[:5])
                  for u in subs:
                      if 'offre' in u or 'emploi' in u or 'job' in u:
                          try:
                              tt=_get(u,'chrome124').text
                              m=re.findall(r'<loc>([^<]*(?:ultra|high-net|investment-solutions)[^<]*)</loc>',tt)
                              print('  sous-plan',u,len(tt),'matchs',m[:5])
                          except Exception as e: print('  ERR',u,str(e)[:60])
                  m=re.findall(r'<loc>([^<]*(?:ultra|high-net|investment-solutions)[^<]*)</loc>',t)
                  print('  matchs',m[:5])
              except Exception as e: print(sm,'ERR',str(e)[:80])
          r=_get(H+'/emploi-carriere/toutes-offres-emploi/stage','chrome124')
          s=BeautifulSoup(r.text,'html.parser')
          for f in s.find_all('form'):
              print('form',f.get('action'),[i.get('name') for i in f.find_all(['input','select'])][:12])
          print('pagination',[a['href'] for a in s.find_all('a',href=True) if 'page=' in a['href']][-4:])
          EOF
