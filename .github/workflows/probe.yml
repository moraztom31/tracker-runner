name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4 curl_cffi
      - name: dr
        run: |
          python - <<'EOF'
          import re
          from curl_cffi import requests as cr
          def get(u,**k): return cr.get(u,impersonate='chrome124',timeout=30,**k)
          B='https://careers.la-francaise.com'
          t=get(B+'/fr/annonces').text
          srcs=sorted(set(re.findall(r'(?:src|href)="([^"]+\.js)"',t)))
          print('scripts:',srcs[:12])
          for s in srcs:
              if not s.startswith('/_nuxt'): continue
              js=get(B+s).text
              print('==',s,len(js))
              for m in sorted(set(re.findall(r'["\'`]([^"\'`]{0,60}(?:job-?ads?|jobs?/|offers?|careers-sites|/ads)[^"\'`]{0,60})["\'`]',js)))[:25]: print('   ',m)
              chunks=sorted(set(re.findall(r'["\']([A-Za-z0-9_-]+\.js)["\']',js)))
              print('   chunks:',chunks[:25])
          EOF
