name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests curl_cffi
      - name: dr
        run: |
          python - <<'EOF'
          from curl_cffi import requests as cr
          H={'Accept':'application/json','Origin':'https://careers.la-francaise.com','Referer':'https://careers.la-francaise.com/'}
          D='careers.la-francaise.com'
          bases=['https://api.digitalrecruiters.com/public/v1','https://api.digitalrecruiters.com/public/careers/v1','https://api.digitalrecruiters.com/v1','https://careers.la-francaise.com/api/v1','https://careers.la-francaise.com/api']
          for b in bases:
              for path in ['/careers-site/job-ads','/careers-sites/'+D+'/job-ads']:
                  for q in ['','?domain_name='+D]:
                      u=b+path+q
                      try:
                          r=cr.get(u,impersonate='chrome124',timeout=20,headers=H)
                          if r.status_code!=404: print(r.status_code,u.replace('https://',''),'|',r.text[:300].replace('\n',' '))
                          else: print(404,u.replace('https://','')[:80])
                      except Exception as e: print('ERR',u[-60:],str(e)[:60])
          EOF
