name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt
      - name: bwelcome
        working-directory: app
        run: |
          python - <<'EOF'
          import re
          from concurrent.futures import ThreadPoolExecutor
          from bs4 import BeautifulSoup
          from tracker.sources import _get
          B='https://bwelcome.hr.bnpparibas'
          t=_get(B+'/fr_FR/externalcareers/sitemap.xml','chrome124').text
          names=[l.rsplit('/',1)[-1] for l in re.findall(r'<loc>\s*([^<]+?)\s*</loc>',t)]
          print('pages:',names)
          def job(i):
              try:
                  r=_get(f'{B}/fr_FR/externalcareers/JobDetails?jobId={i}','chrome124')
              except Exception as e:
                  return i,'ERR '+str(e)[:40]
              s=BeautifulSoup(r.text,'html.parser')
              h=[x.get_text(' ',strip=True) for x in s.find_all('h2')]
              txt=s.get_text(' ',strip=True)
              m=re.search(r'Type de contrat\s*(\S+(?: \S+)?)',txt)
              return i,(h[0][:70] if h else (s.title.string or '').strip()[:70]),(m.group(1) if m else '?')
          with ThreadPoolExecutor(8) as ex:
              for res in ex.map(job,range(104680,104716)): print(res)
          EOF
