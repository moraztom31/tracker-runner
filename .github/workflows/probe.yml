name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q beautifulsoup4 curl_cffi
      - name: test
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cr
          for jid in (112097, 112096, 112098, 112717, 104697):
              r = cr.get(f"https://bwelcome.hr.bnpparibas/fr_FR/externalcareers/JobDetails?jobId={jid}", impersonate="chrome124", timeout=30)
              soup = BeautifulSoup(r.text, "html.parser")
              h1 = [h.get_text(" ", strip=True) for h in soup.find_all("h1")]
              print("==", jid, r.status_code, len(r.text), h1[:3])
              if r.status_code != 200: continue
              strings = list(soup.stripped_strings)
              for i, s in enumerate(strings):
                  if re.search(r"date|publi|posted|ref|créée|mise en ligne|limite|clôture|deadline", s, re.I) and len(s) < 60:
                      print("   ", s, "->", strings[i+1][:60] if i+1 < len(strings) else "")
              for m in re.findall(r'"(?:datePosted|postedDate|publicationDate|datePublished|startDate|validThrough)"\s*:\s*"[^"]+"', r.text)[:6]: print("   json:", m)
              for m in re.findall(r'<meta[^>]+(?:date|time)[^>]*>', r.text, re.I)[:5]: print("   meta:", m[:140])
              print("   last-modified:", r.headers.get("last-modified"), "| date:", r.headers.get("date"))
          PY
