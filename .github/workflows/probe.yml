name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4 curl_cffi
      - name: pagination
        run: |
          python - <<'EOF'
          import re
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cr
          B='https://recrutement.creditmutuel.fr'
          s=cr.Session(impersonate='chrome124')
          def ids(html): return [re.search(r'annonce=(\d+)',a['href']).group(1) for a in BeautifulSoup(html,'html.parser').find_all('a',href=True) if 'annonce=' in a['href']]
          r1=s.get(B+'/fr/nos_offres.html',timeout=30); i1=ids(r1.text); print('page1',len(i1),i1[:6])
          soup=BeautifulSoup(r1.text,'html.parser')
          print('liens pagination:',[(a['href'][:70],a.get_text(' ',strip=True)[:15]) for a in soup.find_all('a',href=True) if re.search(r'nos_offres\d|_p=|page',a['href'])][:6])
          print('formulaires:',[(f.get('action','')[:60],[i.get('name') for i in f.find_all('input')][:8]) for f in soup.find_all('form')][:3])
          for u in ['/fr/nos_offres2.html','/fr/nos_offres3.html']:
              r=s.get(B+u,timeout=30,headers={'Referer':B+'/fr/nos_offres.html'}); i=ids(r.text); print(u,r.status_code,len(i),i[:6],'identique page1' if i==i1 else 'DIFFERENT')
          # avec le lien exact de pagination s'il existe
          for a in soup.find_all('a',href=True):
              if re.search(r'nos_offres\d',a['href']):
                  r=s.get(B+a['href'] if a['href'].startswith('/') else a['href'],timeout=30); i=ids(r.text); print('lien',a['href'][:60],len(i),i[:6],'identique' if i==i1 else 'DIFFERENT'); break
          EOF
