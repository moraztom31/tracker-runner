name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4 curl_cffi
      - name: patrimonia
        run: |
          python - <<'EOF'
          import re, json
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cr
          B='https://www.patrimonia.fr/fr/liste-des-exposants'
          seen={}
          for p in range(1,23):
              u=B if p==1 else f'{B}?guests_list_35237_page={p}'
              r=cr.get(u,impersonate='chrome124',timeout=30)
              s=BeautifulSoup(r.text,'html.parser')
              n=0
              for a in s.find_all('a',href=True):
                  h=a['href']
                  if re.match(r'^(https://www\.patrimonia\.fr)?/fr/liste-des-exposants/[^/?#]+$',h):
                      slug=h.rstrip('/').rsplit('/',1)[-1]
                      name=' | '.join(a.stripped_strings)[:90]
                      card=a
                      for _ in range(4):
                          if card.parent and len(list(card.parent.stripped_strings))<=14: card=card.parent
                      extra=' / '.join(x for x in card.stripped_strings if x not in a.stripped_strings)[:120]
                      if slug not in seen: seen[slug]=(p,name,extra); n+=1
              print('page',p,r.status_code,'nouveaux exposants',n)
              if n==0 and p>20: break
          print('TOTAL',len(seen))
          for slug,(p,name,extra) in seen.items(): print(f'{p:>2} | {name} | {extra}')
          EOF
