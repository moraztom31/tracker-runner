name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          ref: claude/github-repository-access-aoguba
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt
      - name: test des sources
        working-directory: app
        run: |
          python - <<'EOF'
          import yaml, traceback, copy
          from tracker.sources import COLLECTORS
          from tracker.filters import matches
          cfg=yaml.safe_load(open('config.yaml',encoding='utf-8'))
          NEW={'Candriam','Ofi Invest','Quintet','CIC','Comgest','Generali','Janus Henderson','Lazard','Euroclear','Euronext','Allianz','Franklin Templeton'}
          for kind,lst in cfg['sources'].items():
              for c in (lst or []):
                  if c['company'] not in NEW: continue
                  tries=[c]
                  if kind=='workday':
                      tries=[{**c,'host':f"{c['tenant']}.wd{n}.myworkdayjobs.com"} for n in (3,5,1,12,103)]
                  for cc in tries:
                      try:
                          jobs=COLLECTORS[kind](cc)
                      except Exception as e:
                          print(f"[KO] {c['company']} {kind} : {type(e).__name__} {str(e)[:100]}"); continue
                      kept=[j for j in jobs if matches(j,cfg['filters'])]
                      print(f"[OK] {c['company']:<20} {kind:<10} {len(jobs):>4} lues, {len(kept):>3} gardées" + (f"  (host {cc['host']})" if kind=='workday' else ''))
                      for j in (kept or jobs)[:3]: print('      ',j['title'][:70],'|',j.get('location','')[:40],'|',j['url'][:95])
                      break
          EOF
