name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4 curl_cffi
      - name: test
        run: |
          python - <<'PY'
          import re, json, requests
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cr
          UA = {"User-Agent": "Mozilla/5.0"}
          r = requests.post("https://mlp.wd5.myworkdayjobs.com/wday/cxs/mlp/mlpcareers/jobs", json={"appliedFacets": {}, "limit": 20, "offset": 0, "searchText": ""}, headers=UA, timeout=30)
          print("MILLENNIUM", r.status_code, r.text[:200].replace("\n", " "))
          r = requests.get("https://api.lever.co/v0/postings/apax?mode=json", headers=UA, timeout=30)
          print("APAX lever", r.status_code, len(r.json()) if r.status_code == 200 else r.text[:100])
          r = requests.get("https://boards-api.greenhouse.io/v1/boards/marshallwace/jobs", headers=UA, timeout=30)
          print("MARSHALL WACE", r.status_code, len(r.json().get("jobs", [])) if r.status_code == 200 else r.text[:100])
          for u in ["https://www.dnca-investments.com", "https://www.dnca-investments.com/fr", "https://www.dnca-investments.com/fr/carrieres", "https://www.dnca-investments.com/nous-rejoindre", "https://www.dnca-investments.com/fr/nous-rejoindre", "https://www.dnca-investments.com/fr/recrutement", "https://www.dnca-investments.com/careers", "https://www.dnca-investments.com/fr/careers"]:
              try:
                  r = cr.get(u, impersonate="chrome124", timeout=30, allow_redirects=True)
              except Exception as e:
                  print("DNCA ERR", u, type(e).__name__); continue
              soup = BeautifulSoup(r.text, "html.parser")
              links = sorted({a["href"][:90] for a in soup.find_all("a", href=True) if re.search(r"carri|career|recrut|rejoin|offre|job|stage", a["href"] + a.get_text(), re.I)})
              print("DNCA", u[-45:], r.status_code, r.url[-60:], len(r.text), links[:12])
          PY
