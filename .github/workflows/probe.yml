name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests beautifulsoup4 curl_cffi
      - name: pages
        run: |
          python - <<'PY'
          import re
          from bs4 import BeautifulSoup
          from curl_cffi import requests as cr
          urls = """https://www.recrutement.banque-france.fr/fr
          https://www.moelis.com/careers/
          https://talent.ecb.europa.eu/
          https://www.ca-cib.com/careers
          https://www.mandarine-gestion.com/FR/fr/carrieres
          https://www.centerviewpartners.com/careers
          https://pwpartners.com/careers/
          https://www.jefferies.com/careers/
          https://www.mizuhogroup.com/emea/careers
          https://www.eib.org/en/about/careers/
          https://www.caissedesdepots.fr/recrutement""".split()
          for u in urls:
              try:
                  r = cr.get(u, impersonate="chrome124", timeout=25)
              except Exception as e:
                  print("ERR", u, type(e).__name__); continue
              t = r.text
              print("==", u, r.status_code)
              print("  workday:", sorted(set(re.findall(r"https?://[\w\.\-]+myworkdayjobs\.com[\w\-/\.]*", t)))[:6])
              print("  oracle:", sorted(set(re.findall(r"https?://[\w\.\-]+oraclecloud\.[a-z]+[\w\-/\.]*", t)))[:4])
              soup = BeautifulSoup(t, "html.parser")
              ext = sorted({a["href"][:110] for a in soup.find_all("a", href=True) if re.search(r"job|offre|search|recruit|apply|candidat|vacanc|opportunit|career", a["href"], re.I) and a["href"].startswith("http")})
              print("  liens:", ext[:14])
          PY
