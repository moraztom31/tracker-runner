name: probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: moraztom31/TRacker
          ref: claude/github-repository-access-aoguba
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r app/requirements.txt
      - name: test
        working-directory: app
        run: |
          python - <<'PY'
          import yaml, json, time
          from tracker.sources import COLLECTORS
          from tracker.main import drop_dead_links
          from tracker.filters import matches
          cfg = yaml.safe_load(open("config.yaml"))
          c = next(x for x in cfg["sources"]["html_links"] if x["company"] == "Société Générale")
          jobs = COLLECTORS["html_links"](c)
          kept = [j for j in jobs if matches(j, cfg["filters"])]
          t = time.time()
          alive = drop_dead_links(jobs, c, {}, cfg["filters"], True)
          kept2 = [j for j in alive if matches(j, cfg["filters"])]
          print("lues", len(jobs), "gardées avant", len(kept), "après", len(kept2), f"({time.time()-t:.1f}s)")
          gone = [j["title"] for j in kept if j["id"] not in {x["id"] for x in kept2}]
          print("retirées:", len(gone)); [print("  -", g[:70]) for g in gone[:15]]
          print("26000KNA présente après:", any("26000KNA" in j["url"] for j in alive))
          PY
